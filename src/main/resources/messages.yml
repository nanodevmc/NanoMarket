# ═══════════════════════════════════════════════════════════════
#   NanoMarket v2.0.0 — messages.yml
#
#   Формат:
#     &#RRGGBB — hex-цвет, &a … &r — обычные коды цветов
#     {имя}    — подстановка (значения не меняют шрифт и цвет шаблона)
#     `текст`  — участок в обратных кавычках не переводится в ᴍᴀʟʟ ᴄᴀᴘs
#   Шрифт включается в config.yml → style.small-caps.
#   Канал NanoMarket: t.me/NanoDev_mc  |  автор: NanoDev, @radoqi
#
#   Палитра:
#     &#3EE0FF акцент   &#9B6BFF фиолетовый   &#E6EDF7 основной текст
#     &#8B98AD приглушённый   &#FFD166 деньги   &#6EE7A0 успех
#     &#FF6B81 ошибка   &#FFB454 внимание   &#7CC4FF ссылки/команды
#     &#3A4256 рамки
# ═══════════════════════════════════════════════════════════════

